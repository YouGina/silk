services:
  web:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        DJANGO_VERSION: ${DJANGO_VERSION:-5.2}
        PKG_SPEC: ${PKG_SPEC:-django-silk}
    environment:
      # DEBUG=0 is the realistic production case. Any leak that needs DEBUG=1
      # is much weaker; test both.
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      PKG: ${PKG:-silk}
      SILKY_HARDENED: ${SILKY_HARDENED:-0}
      DTB_IPS: ${DTB_IPS:-default}
    ports:
      - "${WEB_PORT:-8010}:8000"
